<!DOCTYPE html>
<html lang="en" class="scroll-smooth" data-page="gallery">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery | Vana Mist Resort Wayanad</title>
    <meta name="description" content="Photos of the villas, pool, dining and spa at Vana Mist Resort, Wayanad." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- STYLES (development mode: Tailwind CDN). For production run `npm run build:css`, then replace the
         next two <script> lines with:  <link rel="stylesheet" href="css/tailwind.css" /> -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="js/tailwind-theme.js"></script>
    <link rel="stylesheet" href="css/style.css" />

    <!-- Config + theme run here so colours are correct before first paint -->
    <script src="js/config.js"></script>
    <script src="js/theme.js"></script>
</head>
<body class="bg-alabaster text-charcoal font-sans antialiased">

    <div id="site-header" data-variant="solid"></div>

    <section class="bg-forest text-alabaster pt-16 pb-12 px-5 md:px-12 text-center">
        <span data-cfg="pages.gallery.eyebrow" class="text-gold text-xs font-bold uppercase tracking-widest"></span>
        <h1 data-cfg="pages.gallery.heading" class="font-serif text-4xl md:text-6xl font-semibold mt-2"></h1>
        <div id="galleryFilters" class="flex flex-wrap justify-center gap-3 mt-8"></div>
    </section>

    <main class="max-w-7xl mx-auto py-14 px-5 md:px-12">
        <div id="galleryGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- Fullscreen lightbox -->
    <div id="lightboxModal" class="fixed inset-0 z-[60] bg-black/90 hidden items-center justify-center p-4" role="dialog" aria-modal="true" aria-label="Photo viewer" onclick="closeLightbox()">
        <button type="button" class="absolute top-6 right-6 text-white text-3xl font-light cursor-pointer" aria-label="Close photo">&times;</button>
        <div class="max-w-4xl w-full text-center" onclick="event.stopPropagation()">
            <img id="lightboxImg" src="" alt="" class="max-h-[80vh] mx-auto rounded-2xl shadow-2xl" />
            <p id="lightboxCaption" class="text-white font-serif text-2xl mt-4"></p>
        </div>
    </div>

    <div id="site-footer"></div>
    <div id="site-floating"></div>

    <script src="js/components.js"></script>
    <script src="js/sections.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
